services:
  - type: web
    name: schoolpro
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: DB_FILE
        value: /var/data/schoolpro.sqlite

      - key: SESSION_SECRET
        generateValue: true

      - key: CREATOR_EMAIL
        sync: false

      - key: CREATOR_PASSWORD
        sync: false

    disk:
      name: schoolpro-data
      mountPath: /var/data
      sizeGB: 1
